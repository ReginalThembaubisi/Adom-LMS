<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;display=swap">
</helmet>
<header style="position:sticky;top:0;z-index:30;background:#F4F3EE;color:#0E0F1A;font-family:'Archivo',system-ui,sans-serif">
  <nav style="max-width:1320px;margin:0 auto;padding:10px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap">
    <a href="Main.dc.html" style="display:block;flex:none"><img src="/_blob/1aa645170006fce6f06f0005945fc632" alt="Adom Technologies — Technology without limit" style="height:56px;display:block"></a>
    <div style="display:flex;align-items:center;gap:26px;flex-wrap:wrap;font-size:15px;font-weight:600">
      <div style="position:relative" onMouseLeave="{{ closeStudy }}">
        <button onClick="{{ toggleStudy }}" onMouseEnter="{{ openStudy }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:4px;padding:8px 0;border-bottom:3px solid {{ studyLine }}" style-hover="color:#0A8C83">Study
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
        <sc-if value="{{ studyOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:100%;left:-16px;padding-top:8px">
            <div style="min-width:240px;background:#0E0F1A;border-radius:12px;padding:8px;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(14,15,26,.35)">
              <sc-for list="{{ studyLinks }}" as="l" hint-placeholder-count="6">
                <a href="{{ l.href }}" style="padding:11px 14px;border-radius:8px;font-size:15px;font-weight:600;color:#F4F3EE;text-decoration:none" style-hover="background:#22D3C5;color:#0E0F1A">{{ l.label }}</a>
              </sc-for>
            </div>
          </div>
        </sc-if>
      </div>
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="3">
        <a href="{{ l.href }}" style="color:#0E0F1A;text-decoration:none;padding:8px 0;border-bottom:3px solid {{ l.line }}" style-hover="color:#0A8C83">{{ l.label }}</a>
      </sc-for>
    </div>
    <div style="display:flex;gap:10px;flex:none">
      <a href="Dashboard.dc.html" style="padding:12px 18px;border-radius:8px;font-size:15px;font-weight:700;color:#0E0F1A;text-decoration:none;white-space:nowrap;border:2px solid #0E0F1A" style-hover="background:#0E0F1A;color:#F4F3EE">myAdom</a>
      <a href="Apply.dc.html" style="padding:12px 20px;border-radius:8px;font-size:15px;font-weight:700;background:#0E0F1A;color:#F4F3EE;text-decoration:none;white-space:nowrap;border:2px solid #0E0F1A" style-hover="background:#22D3C5;border-color:#22D3C5;color:#0E0F1A">Apply now</a>
    </div>
  </nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1200px&quot;,&quot;height&quot;:&quot;80px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;courses&quot;,&quot;learnerships&quot;,&quot;internships&quot;,&quot;placements&quot;,&quot;prospective&quot;,&quot;apply&quot;,&quot;status&quot;,&quot;registration&quot;,&quot;elearning&quot;,&quot;services&quot;,&quot;careers&quot;,&quot;about&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    const a = this.props.active || '';
    const study = ['courses', 'internships', 'placements', 'prospective', 'apply', 'status', 'elearning'];
    return {
      studyOpen: this.state.open,
      toggleStudy: () => this.setState(s => ({ open: !s.open })),
      openStudy: () => this.setState({ open: true }),
      closeStudy: () => this.setState({ open: false }),
      studyLine: study.includes(a) ? '#22D3C5' : 'transparent',
      studyLinks: [
        { label: 'Courses', href: 'Courses.dc.html' }, { label: 'Learnerships', href: 'Learnerships.dc.html' },
        { label: 'Internships', href: 'Internships.dc.html' }, { label: 'University placements', href: 'Placements.dc.html' },
        { label: 'Prospective students', href: 'Prospective.dc.html' },
        { label: 'Apply online', href: 'Apply.dc.html' }, { label: 'Check status', href: 'Status.dc.html' },
        { label: 'e-Learning', href: 'eLearning.dc.html' }
      ],
      links: [['learnerships', 'Learnerships', 'Learnerships.dc.html'], ['services', 'Services', 'Services.dc.html'], ['careers', 'Careers', 'Careers.dc.html'], ['about', 'About', 'About.dc.html']]
        .map(([k, label, href]) => ({ label, href, line: k === a ? '#22D3C5' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
