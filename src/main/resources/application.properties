spring.application.name=learner-assignments

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/learner_assignments_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA Configuration
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Johannesburg

# SQL Initialization (Creates default tables and seeds initial test data safely)
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
file.upload-dir=uploads
# Learner submissions land outside the statically-served uploads/ tree — they are private
# to one learner and are served only through the ownership-checked view endpoint.
file.submission-dir=private-uploads

# Learner portal sessions
learner.session.ttl-hours=24
# Short-lived signed tickets for iframe/document-viewer fetches of a learner's own file.
# Set a stable secret in production so tickets survive a restart; otherwise one is
# generated per boot.
learner.view-ticket.secret=${LEARNER_VIEW_TICKET_SECRET:}
learner.view-ticket.ttl-seconds=300

# Brevo SMTP Mail Relay Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USERNAME:YOUR_BREVO_SMTP_USERNAME}
spring.mail.password=${BREVO_SMTP_KEY:YOUR_BREVO_SMTP_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL:YOUR_SENDER_EMAIL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# JavaMail defaults to no timeout at all ("timeout -1"), so an unreachable relay blocks the
# request thread until the OS gives up on the TCP connect — measured at over two minutes.
# The password reset mail is sent synchronously on purpose, so that thread is a learner
# waiting on a blank screen, and a spike of retries is a thread pool filling up. Fail fast
# and loudly instead: the caller still gets the real error, just in seconds.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Enable Gzip Compression for fast responses (highly optimized for slow/mobile networks)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# Cache static resources (Vite production JS/CSS bundles) in browser for 365 days
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.cache.cachecontrol.cache-public=true

# Staff account seeding
# Nothing here has a default password. An account that already exists is never touched by a
# restart, so a password changed through the admin screens stays changed.
#   FACILITATOR_PASSWORD  - the admin password. Left blank on a fresh install, a random one
#                           is generated and printed once in the startup log.
#   staff.seed.demo-accounts - the demo lecturer/moderator/assessor logins. Off. Turning it on
#                           requires staff.seed.demo-password; it will not invent one.
#   staff.seed.rotate-on-boot - one-shot rotation of the EXISTING admin password to
#                           FACILITATOR_PASSWORD, for the account that has no screen to change
#                           its own. Set it, deploy, check the log, set it back to false.
#                           While it is on, no other change to that password can stick.
staff.seed.demo-accounts=${STAFF_SEED_DEMO_ACCOUNTS:false}
staff.seed.demo-password=${STAFF_SEED_DEMO_PASSWORD:}
staff.seed.rotate-on-boot=${STAFF_PASSWORD_ROTATE:false}

# Cloudinary Storage Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
