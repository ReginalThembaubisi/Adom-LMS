spring.datasource.url=jdbc:h2:mem:poe-test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Entities own the schema here, so a column added to a model can't be forgotten in schema.sql
# and pass the tests anyway.
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.jpa.show-sql=false

cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=

spring.mail.host=localhost
spring.mail.port=3025

learner.session.ttl-hours=24
learner.view-ticket.secret=test-secret-for-view-tickets
learner.view-ticket.ttl-seconds=300
